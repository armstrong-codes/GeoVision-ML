
services:

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: geovision-api

    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000

    ports:
      - "8000:8000"

    environment:
      GEOVISION_MODEL: mobilenet

    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./results:/app/results

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: geovision-dashboard

    command: >
      streamlit run dashboard/app.py
      --server.address 0.0.0.0
      --server.port 8501

    ports:
      - "8501:8501"

    environment:
      GEOVISION_API_URL: http://api:8000

    depends_on:
      api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped
